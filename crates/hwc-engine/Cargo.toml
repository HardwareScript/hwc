[package]
name = "hwc-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
miette = { workspace = true }
rustc-hash = { workspace = true }
compact_str = { workspace = true }
smallvec = { workspace = true }
clipper2-rust = "1.0"
hwc-parser = { workspace = true }
hwc-physics = { workspace = true }
hwc-diagnostics = { workspace = true }
hwc-materials = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
sha2 = { workspace = true }
earcutr = "0.4"
rkyv = { version = "0.7", features = ["validation"] }
memmap2 = "0.9"
bytecheck = "0.6"
salsa = { workspace = true }

[dev-dependencies]
hwc-compiler = { workspace = true }
hwc-export = { workspace = true }
tempfile = "3.13"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "allocation_bench"
harness = false

[[bench]]
name = "hwc_engine_bench"
harness = false
