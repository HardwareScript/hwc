[workspace]
members = [
    "crates/hwc-cli",
    "crates/hwc-diagnostics",
    "crates/hwc-parser",
    "crates/hwc-compiler",
    "crates/hwc-engine",
    "crates/hwc-physics",
    "crates/hwc-export",
    "crates/hwc-materials",
    "crates/hwc-stdlib",
    "crates/hwc-types",
    "crates/hwc-router",
    "crates/hwc-synthesis",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["Olowookere Olamide and HardwareScript Contributors"]
# Licensed under GNU AGPLv3-or-later WITH HardwareScript-Compiler-Output-Exception
# Dual-licensed: AGPLv3 (LICENSE.md) OR Commercial Enterprise License (COMMERCIAL-LICENSE.md)
# See LICENSE.md and COMPILER-OUTPUT-EXCEPTION.md for details
license = "AGPL-3.0-or-later"
repository = "https://github.com/HardwareScript/hwc"
homepage = "https://github.com/HardwareScript/hwc"
documentation = "https://github.com/HardwareScript/hwc"

[workspace.dependencies]
# Core dependencies (v0.1.4 spec: 4 total)
logos = "0.13"
miette = { version = "5.10", features = ["fancy"] }
thiserror = "1.0"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
compact_str = { version = "0.9", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }

# v0.1.8 spatial indexing & cryptographic hashing
rstar = "0.12"
sha2 = "0.10"

# v0.1.9 Salsa incremental computation framework
salsa = "0.16"

# CLI-only dependencies
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# Internal crate dependencies
hwc-types = { path = "crates/hwc-types" }
hwc-diagnostics = { path = "crates/hwc-diagnostics" }
hwc-parser = { path = "crates/hwc-parser" }
hwc-compiler = { path = "crates/hwc-compiler" }
hwc-engine = { path = "crates/hwc-engine" }
hwc-physics = { path = "crates/hwc-physics" }
hwc-export = { path = "crates/hwc-export" }
hwc-materials = { path = "crates/hwc-materials" }
hwc-stdlib = { path = "crates/hwc-stdlib" }
hwc-router = { path = "crates/hwc-router" }
hwc-synthesis = { path = "crates/hwc-synthesis" }

# Clippy lints - strict mode (v0.1.4 spec)
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Critical for compiler reliability
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
similar_names = "allow"
